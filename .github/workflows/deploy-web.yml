name: Deploy Web

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-dogfood
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  eligible:
    if: >-
      github.repository == 'SingleMai/ATape' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: Require both gates on the current main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          latest=$(gh api repos/SingleMai/ATape/git/ref/heads/main --jq .object.sha)
          if [[ "$CANDIDATE" != "$latest" ]]; then
            echo "Skip superseded commit $CANDIDATE"
            exit 0
          fi
          for workflow in ci.yml security.yml; do
            conclusion=$(gh api --method GET \
              "repos/SingleMai/ATape/actions/workflows/$workflow/runs" \
              -f head_sha="$CANDIDATE" -f event=push -f branch=main -f per_page=1 \
              --jq '.workflow_runs[0].conclusion // "pending"')
            if [[ "$conclusion" != success ]]; then
              echo "Wait for $workflow to succeed on $CANDIDATE ($conclusion)"
              exit 0
            fi
          done
          echo "commit=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: eligible
    if: needs.eligible.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.ATAPE_WEB_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: atape-web-${{ github.run_id }}

      - name: Deploy the verified commit through the fixed SSM document
        id: rollout
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.eligible.outputs.commit }}
          INSTANCE_ID: ${{ vars.ATAPE_WEB_DEPLOY_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.ATAPE_WEB_DEPLOY_DOCUMENT_NAME }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/SingleMai/ATape/git/ref/heads/main --jq .object.sha)
          if [[ "$latest" != "$COMMIT" ]]; then
            echo "Skip superseded commit $COMMIT"
            exit 0
          fi
          parameters=$(jq -n --arg sha "$COMMIT" '{CommitSha:[$sha]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" --parameters "$parameters" \
            --timeout-seconds 120 --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 210); do
            if invocation=$(aws ssm get-command-invocation --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" --output json 2>invocation-error.log); then
              status=$(jq -r .Status <<< "$invocation")
              case "$status" in
                Success)
                  jq -r .StandardOutputContent <<< "$invocation"
                  echo "Deployed Web commit $COMMIT" >> "$GITHUB_STEP_SUMMARY"
                  echo 'deployed=true' >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq '{Status,StandardOutputContent,StandardErrorContent}' <<< "$invocation"
                  exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist invocation-error.log; then
              cat invocation-error.log >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command $command_id; inspect it before retrying." >&2
          exit 1

      - name: Confirm the public edge serves the new Web revision
        if: steps.rollout.outputs.deployed == 'true'
        env:
          COMMIT: ${{ needs.eligible.outputs.commit }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --max-time 30 \
            "https://atape.net/__web-release.json?revision=$COMMIT" |
            jq -e --arg sha "$COMMIT" '.commit == $sha'
