name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the pinned pnpm workspace
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install the browser used by Web interaction tests
        run: |
          # Playwright downloads its own pinned Chromium. The runner's unused
          # Chrome apt feed must not block OS dependency installation when its
          # package index and release hashes are temporarily out of sync.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -qE 'https?://dl\.google\.com/linux/chrome[^/ ]*/deb' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm --filter @atape/web exec playwright install --with-deps chromium

      - name: Run repository checks
        run: pnpm check

      - name: Verify Web rollout and rollback behavior
        run: python3 -m unittest discover -s scripts -p 'test_web_deploy.py'

      - name: Build production artifacts
        run: pnpm build

      - name: Verify the exact release tarballs
        run: pnpm test:release

      - name: Run PostgreSQL integration tests
        run: pnpm test:go:integration

      - name: Verify Collector recovery after physical disk exhaustion
        run: pnpm test:collector-disk
