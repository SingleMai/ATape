name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the pinned pnpm workspace
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install the browser used by Web interaction tests
        run: pnpm --filter @atape/web exec playwright install --with-deps chromium

      - name: Run repository checks
        run: pnpm check

      - name: Build production artifacts
        run: pnpm build

      - name: Verify the exact release tarballs
        run: pnpm test:release

      - name: Run PostgreSQL integration tests
        run: pnpm test:go:integration
