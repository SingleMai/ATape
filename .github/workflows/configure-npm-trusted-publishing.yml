name: Configure npm Trusted Publishing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: github.repository == 'SingleMai/ATape'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js for npm account configuration
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Configure the CLI Trusted Publisher
        run: npm trust github @atape/cli --file release.yml --repo SingleMai/ATape --allow-publish --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure the Codex Adapter Trusted Publisher
        run: npm trust github @atape/adapter-codex --file release.yml --repo SingleMai/ATape --allow-publish --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
