<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>ATape · Authentication interaction prototype</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef7e8;
      --navigation: #d8f3ec;
      --panel: #fffaf0;
      --paper: #fffdf7;
      --surface-muted: #f5efdf;
      --ink: #5b4533;
      --muted: #786753;
      --border: #d6c6a6;
      --border-soft: #e9dfc9;
      --navigation-border: #abd6ca;
      --accent: #237f70;
      --accent-strong: #1d665b;
      --accent-bright: #54c8ad;
      --accent-soft: #d9f2e8;
      --yellow: #f4cc61;
      --yellow-soft: #fff1b9;
      --lavender: #e5def7;
      --lavender-border: #b6a5df;
      --success: #4f9e59;
      --success-soft: #dbefd9;
      --warning: #9a661e;
      --warning-soft: #fff1b9;
      --danger: #a84e45;
      --danger-soft: #f6deda;
      --code: #372b23;
      --code-text: #f2e6d2;
      --focus: #e8b900;
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --shadow-resting: 0 2px 5px rgba(91, 69, 51, .05);
      --shadow-raised: 0 12px 34px rgba(91, 69, 51, .12);
      --ease: cubic-bezier(.4, 0, .2, 1);
      font-family: ui-rounded, "Avenir Next", Nunito, "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font-size: 16px; line-height: 1.5; }
    button, input, select { color: inherit; font: inherit; }
    button, select { min-height: 44px; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: var(--accent-strong); text-underline-offset: 3px; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, dialog:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 14px; font-size: clamp(2rem, 4vw, 3.35rem); line-height: 1.02; letter-spacing: -.045em; }
    h2 { margin-bottom: 10px; font-size: clamp(1.35rem, 2.4vw, 1.75rem); line-height: 1.15; letter-spacing: -.025em; }
    h3 { margin-bottom: 5px; font-size: 1rem; }
    h1[tabindex="-1"]:focus { outline: none; }
    small { color: var(--muted); }
    code { font-family: "SFMono-Regular", Consolas, monospace; }

    .hidden { display: none !important; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip-link {
      position: fixed;
      z-index: 500;
      top: 10px;
      left: 12px;
      min-height: 44px;
      padding: 10px 15px;
      border-radius: 999px;
      background: var(--paper);
      font-weight: 850;
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    .prototype-toolbar {
      position: sticky;
      top: 0;
      z-index: 200;
      min-height: 64px;
      padding: 8px clamp(12px, 3vw, 34px);
      border-bottom: 2px solid var(--lavender-border);
      background: color-mix(in srgb, var(--lavender) 92%, white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 18px rgba(75, 56, 103, .08);
    }
    .prototype-label { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .prototype-label strong { white-space: nowrap; }
    .prototype-label span { color: #6c5c82; font-size: 12px; }
    .prototype-controls { display: flex; align-items: center; gap: 8px; }
    .prototype-controls label { color: #594b6e; font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; }
    .prototype-controls select {
      max-width: 260px;
      padding: 8px 34px 8px 12px;
      border: 2px solid var(--lavender-border);
      border-radius: 12px;
      background: var(--paper);
      font-weight: 750;
    }
    .prototype-reset {
      padding: 8px 12px;
      border: 2px solid var(--lavender-border);
      border-radius: 12px;
      background: transparent;
      color: #594b6e;
      font-size: 13px;
      font-weight: 800;
    }
    .prototype-reset:hover { background: var(--paper); }

    .button {
      min-height: 46px;
      padding: 10px 17px;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: transparent;
      font-weight: 850;
      line-height: 1.2;
      text-decoration: none;
      transition: transform 150ms var(--ease), box-shadow 150ms var(--ease), border-color 150ms var(--ease), background 150ms var(--ease);
    }
    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button-primary { border-color: var(--accent); background: var(--accent-bright); box-shadow: 0 4px 9px rgba(91, 69, 51, .11); }
    .button-secondary { border-color: var(--border); background: var(--paper); }
    .button-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
    .button-ghost { color: var(--accent-strong); }
    .button-ghost:hover:not(:disabled) { background: var(--accent-soft); }
    .button-danger { border-color: var(--danger); background: var(--danger-soft); color: #7e332c; }
    .button-quiet-danger { color: var(--danger); }
    .button-quiet-danger:hover:not(:disabled) { background: var(--danger-soft); }
    .button-block { width: 100%; }

    .brand { min-height: 44px; display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-size: 23px; font-weight: 950; text-decoration: none; }
    .brand svg { width: 43px; height: 35px; color: var(--yellow); filter: drop-shadow(0 1px 0 var(--muted)); }
    .eyebrow { margin-bottom: 8px; color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .badge { min-height: 28px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; display: inline-flex; align-items: center; background: var(--surface-muted); color: var(--muted); font-size: 12px; font-weight: 800; line-height: 1.2; }
    .badge-accent { border-color: var(--navigation-border); background: var(--accent-soft); color: var(--accent-strong); }
    .badge-success { border-color: var(--success); background: var(--success-soft); color: #316b3c; }
    .badge-warning { border-color: var(--warning); background: var(--warning-soft); color: #70440a; }
    .badge-danger { border-color: var(--danger); background: var(--danger-soft); color: #7e332c; }
    .avatar { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50% 47% 52% 45%; display: inline-grid; place-items: center; background: var(--yellow); font-size: 13px; font-weight: 950; }

    .auth-page {
      min-height: calc(100vh - 64px);
      padding: clamp(20px, 5vw, 62px);
      background:
        radial-gradient(circle at 8% 88%, rgba(84, 200, 173, .2) 0 120px, transparent 121px),
        radial-gradient(circle at 92% 12%, rgba(244, 204, 97, .25) 0 155px, transparent 156px),
        var(--canvas);
    }
    .auth-header { width: min(1120px, 100%); margin: 0 auto 44px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .account-chip { min-height: 48px; padding: 4px 7px 4px 5px; border: 2px solid var(--border-soft); border-radius: 999px; display: flex; align-items: center; gap: 9px; background: rgba(255, 253, 247, .8); }
    .account-chip .avatar { width: 34px; height: 34px; }
    .account-chip span:last-child { padding-right: 8px; font-size: 13px; font-weight: 800; }
    .auth-grid { width: min(1040px, 100%); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(360px, .8fr); align-items: center; gap: clamp(32px, 8vw, 92px); }
    .auth-story { padding: 20px 0; }
    .auth-story p { max-width: 590px; color: var(--muted); font-size: 1.08rem; }
    .story-points { margin: 28px 0 0; padding: 0; list-style: none; display: grid; gap: 15px; }
    .story-points li { display: flex; align-items: flex-start; gap: 11px; font-weight: 720; }
    .story-points li::before { content: "✓"; width: 25px; height: 25px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); font-size: 13px; font-weight: 950; }
    .auth-card, .decision-card {
      padding: clamp(24px, 4vw, 38px);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-raised);
    }
    .auth-card > p { color: var(--muted); }
    .auth-card-footer { margin: 22px -4px -8px; padding-top: 18px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 13px; }
    .github-mark { width: 22px; height: 22px; }
    .return-context { margin: 0 0 22px; padding: 14px 15px; border: 2px solid var(--navigation-border); border-radius: var(--radius-sm); background: var(--accent-soft); }
    .return-context strong { display: block; margin-bottom: 3px; }
    .instance-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .instance-line code { color: var(--accent-strong); font-size: 12px; }
    .success-strip, .error-strip, .warning-strip {
      margin: 0 0 22px;
      padding: 14px 16px;
      border: 2px solid;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .success-strip { border-color: var(--success); background: var(--success-soft); color: #316b3c; }
    .error-strip { border-color: var(--danger); background: var(--danger-soft); color: #7e332c; }
    .warning-strip { border-color: var(--warning); background: var(--warning-soft); color: #70440a; }
    .success-strip p, .error-strip p, .warning-strip p { margin: 0; }

    .onboarding-page { min-height: calc(100vh - 64px); padding: clamp(20px, 5vw, 62px); background: var(--canvas); }
    .onboarding-wrap { width: min(1000px, 100%); margin: 0 auto; }
    .onboarding-header { margin: 0 0 clamp(38px, 8vw, 76px); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .choice-heading { max-width: 700px; margin: 0 auto 28px; text-align: center; }
    .choice-heading p { color: var(--muted); font-size: 1.05rem; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .choice-card { min-height: 290px; padding: 28px; border: 2px solid var(--border); border-radius: var(--radius-lg); background: var(--paper); display: flex; flex-direction: column; box-shadow: var(--shadow-resting); }
    .choice-card.primary { border-color: var(--navigation-border); background: linear-gradient(145deg, var(--accent-soft), var(--paper) 58%); }
    .choice-icon { width: 54px; height: 54px; margin-bottom: 28px; border-radius: 46% 54% 48% 52%; display: grid; place-items: center; background: var(--yellow); font-size: 24px; font-weight: 900; }
    .choice-card.secondary .choice-icon { background: var(--lavender); }
    .choice-card p { color: var(--muted); }
    .choice-card .button { margin-top: auto; align-self: flex-start; }

    .form-page { width: min(650px, 100%); margin: 0 auto; }
    .back-button { margin: 0 0 18px; padding-left: 5px; }
    .form-card { padding: clamp(24px, 5vw, 42px); border: 2px solid var(--border); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow-raised); }
    .field { margin-top: 22px; }
    .field label { display: block; margin-bottom: 8px; font-weight: 850; }
    .field input { width: 100%; min-height: 50px; padding: 11px 13px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: #fff; }
    .field input[aria-invalid="true"] { border-color: var(--danger); }
    .field-help, .field-error { display: block; margin: 7px 2px 0; font-size: 13px; }
    .field-help { color: var(--muted); }
    .field-error { color: var(--danger); font-weight: 750; }
    .slug-preview { margin: 12px 0 0; padding: 11px 13px; border-radius: 10px; background: var(--surface-muted); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .form-actions { margin-top: 30px; display: flex; align-items: center; gap: 10px; }
    .join-input { font-family: "SFMono-Regular", Consolas, monospace; font-size: 1.35rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .prototype-hint { margin-top: 18px; padding: 11px 13px; border: 1px dashed var(--lavender-border); border-radius: 12px; background: color-mix(in srgb, var(--lavender) 55%, white); color: #625475; font-size: 13px; }

    .cli-page { min-height: calc(100vh - 64px); padding: clamp(20px, 5vw, 58px); background: var(--canvas); }
    .cli-wrap { width: min(770px, 100%); margin: 0 auto; }
    .cli-header { margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .cli-card { overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow-raised); }
    .cli-card-main { padding: clamp(25px, 5vw, 44px); }
    .cli-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
    .cli-title-row h1 { max-width: 570px; font-size: clamp(2rem, 5vw, 2.75rem); }
    .request-code { margin: 28px 0; padding: 18px; border: 2px dashed var(--navigation-border); border-radius: var(--radius-md); background: var(--accent-soft); text-align: center; }
    .request-code span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .request-code code { color: var(--accent-strong); font-size: clamp(1.6rem, 7vw, 2.55rem); font-weight: 900; letter-spacing: .14em; }
    .request-facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .request-facts div { padding: 13px 14px; border-radius: 12px; background: var(--surface-muted); }
    .request-facts dt { color: var(--muted); font-size: 12px; font-weight: 800; }
    .request-facts dd { margin: 2px 0 0; font-weight: 800; overflow-wrap: anywhere; }
    .permission-box { margin-top: 25px; padding-top: 24px; border-top: 1px dashed var(--border); }
    .permission-box h2 { font-size: 1.15rem; }
    .permission-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .permission-group { padding: 15px; border-radius: var(--radius-sm); background: var(--surface-muted); }
    .permission-group.denied { background: #f7f1eb; }
    .permission-group strong { display: block; margin-bottom: 8px; }
    .permission-group ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
    .permission-group li + li { margin-top: 5px; }
    .cli-warning { margin: 22px 0 0; padding: 13px 15px; border-radius: 12px; background: var(--yellow-soft); color: #70440a; font-size: 14px; }
    .cli-actions { padding: 20px clamp(25px, 5vw, 44px); border-top: 2px solid var(--border-soft); background: var(--panel); display: flex; justify-content: flex-end; gap: 10px; }
    .outcome-card { padding: clamp(34px, 8vw, 70px); text-align: center; }
    .outcome-mark { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 48% 52% 45% 55%; display: grid; place-items: center; background: var(--success-soft); color: #316b3c; font-size: 31px; font-weight: 950; }
    .outcome-mark.denied, .outcome-mark.expired { background: var(--danger-soft); color: var(--danger); }
    .outcome-card p { max-width: 480px; margin-right: auto; margin-left: auto; color: var(--muted); }
    .terminal-note { margin: 23px auto 0; padding: 13px 16px; border-radius: 12px; background: var(--code); color: var(--code-text); font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; text-align: left; }

    .workspace-shell { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .workspace-sidebar { position: sticky; top: 64px; height: calc(100vh - 64px); padding: 24px 17px; border-right: 2px solid var(--navigation-border); background: var(--navigation); display: flex; flex-direction: column; gap: 20px; }
    .team-switch { width: 100%; min-height: 66px; padding: 11px 13px; border: 2px solid var(--navigation-border); border-radius: var(--radius-md); background: rgba(255, 253, 247, .86); display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .team-switch span { display: grid; }
    .team-switch small { font-size: 12px; }
    .workspace-nav { display: grid; gap: 6px; }
    .workspace-nav-label { margin: 5px 10px 2px; color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .workspace-nav button { width: 100%; min-height: 46px; padding: 9px 12px; border: 2px solid transparent; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px; background: transparent; text-align: left; font-weight: 760; }
    .workspace-nav button:hover { background: rgba(255, 253, 247, .55); }
    .workspace-nav button.active { border-color: var(--navigation-border); background: var(--paper); color: var(--accent-strong); }
    .workspace-sidebar-footer { margin-top: auto; padding: 12px; border: 2px dashed var(--navigation-border); border-radius: var(--radius-sm); color: var(--accent-strong); font-size: 13px; font-weight: 800; }
    .workspace-main { min-width: 0; }
    .workspace-topbar { min-height: 72px; padding: 0 clamp(20px, 4vw, 52px); border-bottom: 2px dashed color-mix(in srgb, var(--border) 55%, transparent); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: color-mix(in srgb, var(--canvas) 84%, white); }
    .workspace-topbar strong { font-size: 14px; }
    .settings-content { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 80px; }
    .settings-heading { margin-bottom: 30px; }
    .settings-heading h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
    .settings-heading p { max-width: 650px; color: var(--muted); }
    .settings-section { margin-top: 22px; overflow: hidden; border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--paper); box-shadow: var(--shadow-resting); }
    .settings-section > header { padding: 20px 22px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .settings-section > header h2 { margin-bottom: 4px; font-size: 1.2rem; }
    .settings-section > header p { margin: 0; color: var(--muted); font-size: 14px; }
    .settings-row { min-height: 78px; padding: 15px 22px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .settings-row + .settings-row { border-top: 1px solid var(--border-soft); }
    .row-identity { min-width: 0; display: flex; align-items: center; gap: 13px; }
    .row-icon { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center; background: var(--surface-muted); font-weight: 900; }
    .row-copy { min-width: 0; }
    .row-copy strong { display: block; overflow-wrap: anywhere; }
    .row-copy span { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .row-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .section-footer { padding: 14px 22px; border-top: 1px solid var(--border-soft); background: var(--panel); display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .section-footer p { margin: 0; color: var(--muted); font-size: 13px; }
    .empty-row { padding: 26px 22px; color: var(--muted); text-align: center; }
    .join-code-panel { padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 22px; }
    .join-code { margin: 8px 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .join-code code { padding: 8px 12px; border: 2px dashed var(--navigation-border); border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong); font-size: 1.45rem; font-weight: 900; letter-spacing: .12em; }
    .join-code-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .one-time-note { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--warning-soft); color: #70440a; font-size: 13px; }
    .member-role { margin-left: 8px; }
    .owner-note { margin: 0; padding: 14px 22px; border-top: 1px solid var(--border-soft); background: var(--warning-soft); color: #70440a; font-size: 13px; }

    .workspace-empty { padding: clamp(26px, 6vw, 58px); border: 2px solid var(--border); border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--yellow-soft), var(--paper) 67%); }
    .workspace-empty p { max-width: 620px; color: var(--muted); }
    .next-step { margin-top: 25px; padding: 18px; border-radius: var(--radius-md); background: var(--code); color: var(--code-text); }
    .next-step span { display: block; margin-bottom: 9px; color: #cbbda8; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .next-step code { display: block; line-height: 1.8; }

    dialog { width: min(500px, calc(100% - 28px)); padding: 0; border: 2px solid var(--border); border-radius: var(--radius-lg); background: var(--paper); color: var(--ink); box-shadow: var(--shadow-raised); }
    dialog::backdrop { background: rgba(55, 43, 35, .35); backdrop-filter: blur(2px); }
    .dialog-body { padding: 27px 28px 22px; }
    .dialog-body p { margin-bottom: 0; color: var(--muted); }
    .dialog-actions { padding: 16px 20px; border-top: 1px solid var(--border-soft); background: var(--panel); display: flex; justify-content: flex-end; gap: 9px; }
    .toast { position: fixed; z-index: 400; right: 18px; bottom: 18px; max-width: min(390px, calc(100% - 36px)); padding: 13px 17px; border: 2px solid var(--accent); border-radius: var(--radius-sm); background: var(--paper); color: var(--accent-strong); box-shadow: var(--shadow-raised); font-weight: 800; transform: translateY(160%); opacity: 0; transition: transform 180ms var(--ease), opacity 180ms var(--ease); }
    .toast.visible { transform: translateY(0); opacity: 1; }

    @media (max-width: 820px) {
      .prototype-toolbar { align-items: flex-start; }
      .prototype-label span { display: none; }
      .prototype-controls { min-width: 0; }
      .prototype-controls label { display: none; }
      .prototype-controls select { min-width: 0; max-width: 58vw; }
      .auth-grid { grid-template-columns: 1fr; gap: 24px; }
      .auth-story { padding-bottom: 0; text-align: center; }
      .story-points { display: none; }
      .auth-card { width: min(520px, 100%); margin: 0 auto; }
      .choice-grid { grid-template-columns: 1fr; }
      .choice-card { min-height: 235px; }
      .workspace-shell { display: block; }
      .workspace-sidebar { position: static; width: 100%; height: auto; padding: 13px 16px; border-right: 0; border-bottom: 2px solid var(--navigation-border); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; }
      .workspace-sidebar .brand { font-size: 20px; }
      .workspace-sidebar .brand svg { width: 36px; }
      .team-switch, .workspace-sidebar-footer, .workspace-nav-label { display: none; }
      .workspace-nav { display: flex; justify-content: flex-end; overflow-x: auto; }
      .workspace-nav button { width: auto; white-space: nowrap; }
      .request-facts, .permission-columns { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .prototype-toolbar { min-height: 64px; padding: 7px 10px; gap: 8px; }
      .prototype-label { display: none; }
      .prototype-controls { width: 100%; }
      .prototype-controls select { min-width: 0; max-width: none; flex: 1; padding-right: 24px; font-size: 13px; }
      .auth-page, .onboarding-page, .cli-page { min-height: calc(100vh - 64px); padding: 18px 14px 36px; }
      .auth-header, .onboarding-header, .cli-header { margin-bottom: 30px; }
      .account-chip span:last-child { display: none; }
      .auth-story { text-align: left; }
      .auth-story h1 { font-size: 2.35rem; }
      .auth-card, .decision-card, .form-card { padding: 23px 19px; border-radius: var(--radius-md); }
      .choice-card { padding: 23px 20px; }
      .choice-icon { margin-bottom: 18px; }
      .form-actions, .cli-actions { align-items: stretch; flex-direction: column-reverse; }
      .form-actions .button, .cli-actions .button { width: 100%; }
      .cli-card-main { padding: 25px 19px; }
      .cli-title-row { display: block; }
      .cli-title-row .badge { margin-bottom: 12px; }
      .request-code code { letter-spacing: .08em; }
      .workspace-sidebar { grid-template-columns: 1fr; gap: 10px; }
      .workspace-sidebar > .brand { display: none; }
      .workspace-nav { justify-content: flex-start; }
      .workspace-nav button { flex: 1 0 auto; justify-content: center; }
      .workspace-topbar { min-height: 61px; padding: 0 17px; }
      .workspace-topbar span { display: none; }
      .settings-content { width: min(100% - 24px, 920px); padding-top: 27px; }
      .settings-section > header, .settings-row, .section-footer { padding-right: 16px; padding-left: 16px; }
      .settings-section > header, .settings-row, .section-footer { align-items: stretch; flex-direction: column; }
      .row-actions { width: 100%; }
      .row-actions .button { flex: 1; }
      .join-code-panel { grid-template-columns: 1fr; padding: 18px 16px; }
      .join-code-actions { justify-content: flex-start; }
      .join-code-actions .button { flex: 1; }
      .dialog-actions { flex-direction: column-reverse; }
      .dialog-actions .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <aside class="prototype-toolbar" aria-label="Prototype controls">
    <div class="prototype-label">
      <strong>Interaction prototype</strong>
      <span>Review controls · not part of ATape</span>
    </div>
    <div class="prototype-controls">
      <label for="scenario-select">Jump to</label>
      <select id="scenario-select">
        <option value="login">Sign in</option>
        <option value="onboarding">First Team choice</option>
        <option value="create-team">Create a Team</option>
        <option value="join-team">Join a Team</option>
        <option value="cli-signed-out">CLI request · signed out</option>
        <option value="cli-review">CLI request · review</option>
        <option value="cli-expired">CLI request · expired</option>
        <option value="workspace">First workspace</option>
        <option value="account">Account security</option>
        <option value="account-error">Account · temporary error</option>
        <option value="team">Team &amp; access</option>
      </select>
      <button class="prototype-reset" type="button" data-action="reset-prototype">Reset</button>
    </div>
  </aside>

  <div id="app"></div>

  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-body">
      <p class="eyebrow" id="dialog-eyebrow">Confirm action</p>
      <h2 id="dialog-title">Are you sure?</h2>
      <p id="dialog-description"></p>
    </div>
    <div class="dialog-actions">
      <button class="button button-secondary" type="button" data-action="close-dialog">Cancel</button>
      <button class="button button-danger" id="dialog-confirm" type="button">Confirm</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const app = document.querySelector("#app")
    const scenarioSelect = document.querySelector("#scenario-select")
    const dialog = document.querySelector("#confirm-dialog")
    const dialogTitle = document.querySelector("#dialog-title")
    const dialogDescription = document.querySelector("#dialog-description")
    const dialogEyebrow = document.querySelector("#dialog-eyebrow")
    const dialogConfirm = document.querySelector("#dialog-confirm")
    const toast = document.querySelector("#toast")

    const initialSessions = () => [
      { id: "session-current", title: "Safari on macOS", detail: "This session · active now", current: true },
      { id: "session-mobile", title: "Safari on iPhone", detail: "Last used yesterday", current: false },
      { id: "session-chrome", title: "Chrome on macOS", detail: "Last used 6 days ago", current: false }
    ]

    const initialCredentials = () => [
      { id: "credential-main", title: "atape-cli", detail: "Created today · last used 3 minutes ago" },
      { id: "credential-old", title: "atape-cli", detail: "Created Aug 19 · last used Aug 28" }
    ]

    const state = {
      screen: "login",
      signedIn: false,
      returnTo: null,
      flash: "",
      teamName: "Personal Lab",
      teamSlug: "personal-lab",
      cliStatus: "pending",
      settingsTab: "account",
      serviceError: false,
      sessions: initialSessions(),
      credentials: initialCredentials(),
      joinEnabled: true,
      joinCode: "7K2M9A",
      joinCodeFresh: false,
      members: [
        { id: "me", handle: "@singlemai", name: "Mai Li", role: "Owner", current: true },
        { id: "alex", handle: "@alex", name: "Alex Chen", role: "Member", current: false }
      ]
    }

    let pendingConfirmation = null
    let toastTimer = null

    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;")

    const tapeMark = () => `
      <svg aria-hidden="true" viewBox="0 0 48 38">
        <path d="M8 4h32l5 7v16l-5 7H8l-5-7V11z" fill="currentColor" stroke="#705844" stroke-width="1.5" />
        <circle cx="18" cy="19" r="6" fill="#fffaf1" />
        <circle cx="30" cy="19" r="6" fill="#fffaf1" />
        <circle cx="18" cy="19" r="2" fill="#705844" />
        <circle cx="30" cy="19" r="2" fill="#705844" />
      </svg>`

    const brand = () => `<a class="brand" href="#" data-action="brand-home" aria-label="ATape home">${tapeMark()}<span>ATape</span></a>`

    const accountChip = () => `
      <div class="account-chip" aria-label="Signed in as singlemai">
        <span class="avatar" aria-hidden="true">ML</span>
        <span>@singlemai</span>
      </div>`

    const githubIcon = () => `
      <svg class="github-mark" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.23.7-3.9-1.37-3.9-1.37-.53-1.35-1.3-1.7-1.3-1.7-1.05-.73.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.58-.3-5.29-1.29-5.29-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.72 5.39-5.3 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z" />
      </svg>`

    const pageHeader = (signedIn = true) => `
      <header class="${state.screen === "cli" ? "cli-header" : "onboarding-header"}">
        ${brand()}
        ${signedIn ? accountChip() : ""}
      </header>`

    function renderLogin() {
      const cliReturn = state.returnTo === "cli"
      return `
        <div class="auth-page">
          <header class="auth-header">${brand()}</header>
          <main class="auth-grid" id="main-content" tabindex="-1">
            <section class="auth-story" aria-labelledby="login-story-title">
              <p class="eyebrow">Shared agent memory</p>
              <h1 id="login-story-title" tabindex="-1">Keep the thread.<br />Own the context.</h1>
              <p>ATape turns conversations from your local tools into searchable memory for the Teams and Projects you choose.</p>
              <ul class="story-points">
                <li>Your account works across the Web and CLI.</li>
                <li>Local folders stay local until you explicitly set one up.</li>
                <li>Self-hosted instances own their complete login stack.</li>
              </ul>
            </section>
            <section class="auth-card" aria-labelledby="sign-in-title">
              ${state.flash ? `<div class="success-strip"><p>${escapeHtml(state.flash)}</p></div>` : ""}
              ${cliReturn ? `
                <div class="return-context">
                  <strong>CLI sign-in in progress</strong>
                  <span>Sign in first, then review the request from <code>atape-cli</code>. Nothing will be approved automatically.</span>
                </div>` : ""}
              <p class="eyebrow">Welcome${cliReturn ? " back" : ""}</p>
              <h2 id="sign-in-title">Sign in to ATape</h2>
              <p>Continue with your GitHub identity. New accounts are created automatically.</p>
              <button class="button button-primary button-block" type="button" data-action="github-login">
                ${githubIcon()} Continue with GitHub
              </button>
              <div class="auth-card-footer">
                <div class="instance-line"><span>Signing in to</span> <code>https://atape.dev</code></div>
                <p>By continuing, you agree to this instance’s terms and privacy policy.</p>
              </div>
            </section>
          </main>
        </div>`
    }

    function renderOnboarding() {
      return `
        <div class="onboarding-page">
          <div class="onboarding-wrap">
            ${pageHeader(true)}
            <main id="main-content" tabindex="-1">
              <section class="choice-heading" aria-labelledby="team-choice-title">
                <p class="eyebrow">Welcome, Mai</p>
                <h1 id="team-choice-title" tabindex="-1">Start with a Team</h1>
                <p>A Team is the shared boundary for Projects and people. You can create or join more Teams later.</p>
              </section>
              <div class="choice-grid">
                <article class="choice-card primary">
                  <div class="choice-icon" aria-hidden="true">＋</div>
                  <h2>Create a Team</h2>
                  <p>Start a new space, then connect your first local Project from the CLI.</p>
                  <button class="button button-primary" type="button" data-action="open-create-team">Create a Team</button>
                </article>
                <article class="choice-card secondary">
                  <div class="choice-icon" aria-hidden="true">↗</div>
                  <h2>Join with a code</h2>
                  <p>Use the six-character code an Owner shared with you. You can type it in either case.</p>
                  <button class="button button-secondary" type="button" data-action="open-join-team">Join a Team</button>
                </article>
              </div>
            </main>
          </div>
        </div>`
    }

    function renderCreateTeam() {
      return `
        <div class="onboarding-page">
          <div class="onboarding-wrap">
            ${pageHeader(true)}
            <main class="form-page" id="main-content" tabindex="-1">
              <button class="button button-ghost back-button" type="button" data-action="back-onboarding">← Back</button>
              <form class="form-card" id="create-team-form" novalidate>
                <p class="eyebrow">New Team</p>
                <h1 id="create-team-title" tabindex="-1">Name your shared space</h1>
                <p class="muted">You will be its first Owner. Team settings and members can be managed from the Web.</p>
                <div class="field">
                  <label for="team-name">Team name</label>
                  <input id="team-name" name="teamName" autocomplete="organization" value="Personal Lab" required maxlength="60" aria-describedby="team-name-help" />
                  <span class="field-help" id="team-name-help">Use the name people on this Team will recognize.</span>
                </div>
                <div class="field">
                  <label for="team-slug">Web address</label>
                  <input id="team-slug" name="teamSlug" value="personal-lab" required maxlength="48" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" aria-describedby="team-slug-help team-url-preview" />
                  <span class="field-help" id="team-slug-help">Lowercase letters, numbers, and single hyphens.</span>
                  <div class="slug-preview" id="team-url-preview">https://atape.dev/teams/<strong>personal-lab</strong></div>
                </div>
                <div class="form-actions">
                  <button class="button button-primary" type="submit">Create Team</button>
                  <button class="button button-ghost" type="button" data-action="back-onboarding">Cancel</button>
                </div>
              </form>
            </main>
          </div>
        </div>`
    }

    function renderJoinTeam() {
      return `
        <div class="onboarding-page">
          <div class="onboarding-wrap">
            ${pageHeader(true)}
            <main class="form-page" id="main-content" tabindex="-1">
              <button class="button button-ghost back-button" type="button" data-action="back-onboarding">← Back</button>
              <form class="form-card" id="join-team-form" novalidate>
                <p class="eyebrow">Join a Team</p>
                <h1 id="join-team-title" tabindex="-1">Enter your join code</h1>
                <p class="muted">Codes contain six letters and numbers. Spaces and letter case do not matter.</p>
                <div class="field">
                  <label for="join-code">Team join code</label>
                  <input class="join-input" id="join-code" name="joinCode" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" maxlength="8" placeholder="K7M4PX" required aria-describedby="join-code-help join-code-error" />
                  <span class="field-help" id="join-code-help">Ask a Team Owner if your code has expired or been rotated.</span>
                  <span class="field-error hidden" id="join-code-error" role="alert">That code is invalid or no longer active.</span>
                </div>
                <div class="prototype-hint"><strong>Prototype hint:</strong> use <code>AT9K2M</code> to try the success path.</div>
                <div class="form-actions">
                  <button class="button button-primary" type="submit">Join Team</button>
                  <button class="button button-ghost" type="button" data-action="back-onboarding">Cancel</button>
                </div>
              </form>
            </main>
          </div>
        </div>`
    }

    function renderCli() {
      if (state.cliStatus !== "pending") return renderCliOutcome()

      return `
        <div class="cli-page">
          <div class="cli-wrap">
            ${pageHeader(true)}
            <main id="main-content" tabindex="-1">
              <section class="cli-card" aria-labelledby="cli-title">
                <div class="cli-card-main">
                  <div class="cli-title-row">
                    <div>
                      <p class="eyebrow">CLI authorization</p>
                      <h1 id="cli-title" tabindex="-1">Allow <code>atape-cli</code> to use your account?</h1>
                    </div>
                    <span class="badge badge-warning">Approval required</span>
                  </div>
                  <p class="muted">Check that the code and instance below match your terminal before continuing.</p>
                  <div class="request-code">
                    <span>Code shown in your terminal</span>
                    <code aria-label="Q 7 K M, 4 W D P">Q7KM-4WDP</code>
                  </div>
                  <dl class="request-facts">
                    <div><dt>ATape instance</dt><dd>https://atape.dev</dd></div>
                    <div><dt>Signed in as</dt><dd>@singlemai</dd></div>
                  </dl>
                  <section class="permission-box" aria-labelledby="cli-permissions-title">
                    <h2 id="cli-permissions-title">What this CLI can do</h2>
                    <div class="permission-columns">
                      <div class="permission-group">
                        <strong>Allowed</strong>
                        <ul>
                          <li>See visible Team and Project names</li>
                          <li>Create Projects in Teams you can use</li>
                          <li>Upload captured conversation data</li>
                        </ul>
                      </div>
                      <div class="permission-group denied">
                        <strong>Not allowed</strong>
                        <ul>
                          <li>Read conversations or search results</li>
                          <li>Manage Team members or Owners</li>
                          <li>Change account security settings</li>
                        </ul>
                      </div>
                    </div>
                  </section>
                  <p class="cli-warning"><strong>Didn’t start this?</strong> Deny the request. Never approve a code sent by someone else.</p>
                </div>
                <footer class="cli-actions">
                  <button class="button button-secondary" type="button" data-action="deny-cli">Deny</button>
                  <button class="button button-primary" type="button" data-action="approve-cli">Authorize CLI</button>
                </footer>
              </section>
            </main>
          </div>
        </div>`
    }

    function renderCliOutcome() {
      const outcomes = {
        approved: {
          eyebrow: "Authorization complete",
          mark: "✓",
          title: "The CLI is connected",
          body: "Return to your terminal to continue. This browser never receives or displays the CLI credential.",
          terminal: "Authorization approved. Finishing sign-in…",
          className: ""
        },
        denied: {
          eyebrow: "Request denied",
          mark: "×",
          title: "The CLI was not connected",
          body: "No credential was issued. You can close this page safely.",
          terminal: "Authorization denied by user.",
          className: "denied"
        },
        expired: {
          eyebrow: "Request expired",
          mark: "!",
          title: "This code is no longer valid",
          body: "CLI requests expire after 15 minutes. Return to your terminal and start sign-in again to get a new code.",
          terminal: "$ atape login",
          className: "expired"
        }
      }
      const outcome = outcomes[state.cliStatus]
      return `
        <div class="cli-page">
          <div class="cli-wrap">
            ${pageHeader(true)}
            <main id="main-content" tabindex="-1">
              <section class="cli-card outcome-card" aria-labelledby="cli-outcome-title">
                <div class="outcome-mark ${outcome.className}" aria-hidden="true">${outcome.mark}</div>
                <p class="eyebrow">${outcome.eyebrow}</p>
                <h1 id="cli-outcome-title" tabindex="-1">${outcome.title}</h1>
                <p>${outcome.body}</p>
                <div class="terminal-note">${escapeHtml(outcome.terminal)}</div>
                ${state.cliStatus === "expired" ? `<button class="button button-secondary" style="margin-top:22px" type="button" data-action="restart-cli">Preview a new request</button>` : ""}
              </section>
            </main>
          </div>
        </div>`
    }

    function renderWorkspaceShell(content, activeTab) {
      return `
        <div class="workspace-shell">
          <aside class="workspace-sidebar" aria-label="Workspace">
            ${brand()}
            <div class="team-switch" aria-label="Current Team: ${escapeHtml(state.teamName)}">
              <span><strong>${escapeHtml(state.teamName)}</strong><small>/teams/${escapeHtml(state.teamSlug)}</small></span>
              <span class="badge">Current</span>
            </div>
            <nav class="workspace-nav" aria-label="ATape sections">
              <p class="workspace-nav-label">Workspace</p>
              <button class="${activeTab === "workspace" ? "active" : ""}" type="button" data-action="open-workspace" ${activeTab === "workspace" ? 'aria-current="page"' : ""}><span aria-hidden="true">⌂</span> Overview</button>
              <p class="workspace-nav-label">Settings</p>
              <button class="${activeTab === "account" ? "active" : ""}" type="button" data-action="open-account" ${activeTab === "account" ? 'aria-current="page"' : ""}><span aria-hidden="true">◎</span> Account</button>
              <button class="${activeTab === "team" ? "active" : ""}" type="button" data-action="open-team" ${activeTab === "team" ? 'aria-current="page"' : ""}><span aria-hidden="true">♢</span> Team &amp; access</button>
            </nav>
            <div class="workspace-sidebar-footer">● Team memory refreshes automatically</div>
          </aside>
          <div class="workspace-main">
            <header class="workspace-topbar">
              <span>${escapeHtml(state.teamName)} / <strong>${activeTab === "workspace" ? "Overview" : "Settings"}</strong></span>
              ${accountChip()}
            </header>
            ${content}
          </div>
        </div>`
    }

    function renderWorkspace() {
      const content = `
        <main class="settings-content" id="main-content" tabindex="-1">
          ${state.flash ? `<div class="success-strip"><p>${escapeHtml(state.flash)}</p></div>` : ""}
          <section class="workspace-empty" aria-labelledby="workspace-title">
            <p class="eyebrow">${state.flash && state.flash.startsWith("Joined") ? "Team joined" : "Team created"}</p>
            <h1 id="workspace-title" tabindex="-1">Bring in your first Project</h1>
            <p>The Team is ready. In your terminal, sign in to this ATape instance and choose the local directory you want to sync.</p>
            <div class="next-step">
              <span>Continue in your terminal</span>
              <code>$ atape login</code>
              <code>$ atape setup .</code>
            </div>
          </section>
        </main>`
      return renderWorkspaceShell(content, "workspace")
    }

    function renderAccountSettings() {
      const sessions = state.sessions.length ? state.sessions.map((session) => `
        <div class="settings-row">
          <div class="row-identity">
            <span class="row-icon" aria-hidden="true">${session.current ? "◉" : "○"}</span>
            <div class="row-copy">
              <strong>${escapeHtml(session.title)} ${session.current ? '<span class="badge badge-success">Current</span>' : ""}</strong>
              <span>${escapeHtml(session.detail)}</span>
            </div>
          </div>
          <div class="row-actions">
            <button class="button ${session.current ? "button-secondary" : "button-quiet-danger"}" type="button" data-action="revoke-session" data-id="${session.id}">${session.current ? "Sign out" : "Revoke"}</button>
          </div>
        </div>`).join("") : `<div class="empty-row">No active browser sessions.</div>`

      const credentials = state.credentials.length ? state.credentials.map((credential) => `
        <div class="settings-row">
          <div class="row-identity">
            <span class="row-icon" aria-hidden="true">⌘</span>
            <div class="row-copy"><strong>${escapeHtml(credential.title)}</strong><span>${escapeHtml(credential.detail)}</span></div>
          </div>
          <div class="row-actions"><button class="button button-quiet-danger" type="button" data-action="revoke-credential" data-id="${credential.id}">Revoke</button></div>
        </div>`).join("") : `<div class="empty-row">No active CLI credentials.</div>`

      const content = `
        <main class="settings-content" id="main-content" tabindex="-1">
          ${state.serviceError ? `
            <div class="error-strip" role="alert">
              <p><strong>Sessions could not be loaded.</strong><br />Your existing sign-ins are unaffected.</p>
              <button class="button button-secondary" type="button" data-action="retry-account">Try again</button>
            </div>` : ""}
          <header class="settings-heading">
            <p class="eyebrow">Personal settings</p>
            <h1 id="account-settings-title" tabindex="-1">Account security</h1>
            <p>Review how you sign in and remove access you no longer recognize. ATape stores only practical labels and recent activity—not a device inventory.</p>
          </header>

          <section class="settings-section" aria-labelledby="signin-methods-title">
            <header><div><h2 id="signin-methods-title">Sign-in methods</h2><p>Use any connected identity to reach the same ATape account.</p></div></header>
            <div class="settings-row">
              <div class="row-identity"><span class="row-icon" aria-hidden="true">GH</span><div class="row-copy"><strong>GitHub <span class="badge badge-success">Connected</span></strong><span>@singlemai</span></div></div>
            </div>
            <footer class="section-footer"><p>More sign-in methods appear only when this ATape instance enables them.</p></footer>
          </section>

          <section class="settings-section" aria-labelledby="sessions-title">
            <header><div><h2 id="sessions-title">Browser sessions</h2><p>Sessions end after 30 idle days or 180 days total.</p></div><span class="badge">${state.sessions.length} active</span></header>
            ${state.serviceError ? `<div class="empty-row">Session details are temporarily unavailable.</div>` : sessions}
            ${!state.serviceError && state.sessions.length ? `<footer class="section-footer"><p>Revoke all signs this account out in every browser, including this one.</p><button class="button button-quiet-danger" type="button" data-action="revoke-all-sessions">Revoke all</button></footer>` : ""}
          </section>

          <section class="settings-section" aria-labelledby="credentials-title">
            <header><div><h2 id="credentials-title">CLI credentials</h2><p>Credentials are shown here by creation and last-use time. Secret values are never shown again.</p></div><span class="badge">${state.credentials.length} active</span></header>
            ${credentials}
            ${state.credentials.length ? `<footer class="section-footer"><p>Use this if a computer is lost or you no longer trust any CLI login.</p><button class="button button-quiet-danger" type="button" data-action="revoke-all-credentials">Revoke all</button></footer>` : ""}
          </section>
        </main>`
      return renderWorkspaceShell(content, "account")
    }

    function renderTeamSettings() {
      const owners = state.members.filter((member) => member.role === "Owner").length
      const members = state.members.map((member) => `
        <div class="settings-row">
          <div class="row-identity">
            <span class="avatar" aria-hidden="true">${member.id === "me" ? "ML" : "AC"}</span>
            <div class="row-copy"><strong>${escapeHtml(member.name)} ${member.current ? '<span class="badge">You</span>' : ""}<span class="badge badge-accent member-role">${member.role}</span></strong><span>${escapeHtml(member.handle)}</span></div>
          </div>
          <div class="row-actions">
            ${member.current ? `<button class="button button-quiet-danger" type="button" ${owners === 1 ? "disabled" : ""} data-action="leave-team">Leave Team</button>` : `
              <button class="button button-secondary" type="button" data-action="toggle-member-role" data-id="${member.id}">${member.role === "Owner" ? "Make Member" : "Make Owner"}</button>
              <button class="button button-quiet-danger" type="button" data-action="remove-member" data-id="${member.id}">Remove</button>`}
          </div>
        </div>`).join("")

      const content = `
        <main class="settings-content" id="main-content" tabindex="-1">
          <header class="settings-heading">
            <p class="eyebrow">${escapeHtml(state.teamName)}</p>
            <h1 id="team-settings-title" tabindex="-1">Team &amp; access</h1>
            <p>Invite people with a short code and keep at least one Owner responsible for the Team.</p>
          </header>

          <section class="settings-section" aria-labelledby="join-code-title">
            <header><div><h2 id="join-code-title">Team join code</h2><p>Anyone with an active code can join as a Member.</p></div><span class="badge ${state.joinEnabled ? "badge-success" : ""}">${state.joinEnabled ? "Active" : "Disabled"}</span></header>
            <div class="join-code-panel">
              <div>
                ${state.joinEnabled ? `<div class="join-code"><code>${escapeHtml(state.joinCode)}</code><span class="muted">case-insensitive</span></div>` : `<strong>New members cannot join by code.</strong>`}
                ${state.joinCodeFresh ? `<p class="one-time-note" role="status"><strong>Copy this now.</strong> The new code is shown once; the previous code stopped working immediately.</p>` : ""}
              </div>
              <div class="join-code-actions">
                ${state.joinEnabled ? `
                  <button class="button button-secondary" type="button" data-action="copy-join-code">Copy</button>
                  <button class="button button-secondary" type="button" data-action="rotate-join-code">Rotate</button>
                  <button class="button button-quiet-danger" type="button" data-action="disable-join-code">Disable</button>` : `
                  <button class="button button-primary" type="button" data-action="enable-join-code">Create new code</button>`}
              </div>
            </div>
          </section>

          <section class="settings-section" aria-labelledby="members-title">
            <header><div><h2 id="members-title">Members</h2><p>Owners manage people and Team security. Members can create and use Projects.</p></div><span class="badge">${state.members.length} people</span></header>
            ${members}
            ${owners === 1 ? `<p class="owner-note"><strong>You are the only Owner.</strong> Make another member an Owner before you leave this Team.</p>` : ""}
          </section>
        </main>`
      return renderWorkspaceShell(content, "team")
    }

    function render({ focus = false } = {}) {
      let markup = ""
      if (state.screen === "login") markup = renderLogin()
      if (state.screen === "onboarding") markup = renderOnboarding()
      if (state.screen === "create-team") markup = renderCreateTeam()
      if (state.screen === "join-team") markup = renderJoinTeam()
      if (state.screen === "cli") markup = renderCli()
      if (state.screen === "workspace") markup = renderWorkspace()
      if (state.screen === "account") markup = renderAccountSettings()
      if (state.screen === "team") markup = renderTeamSettings()
      app.innerHTML = markup

      const scenarioValue = scenarioForState()
      if ([...scenarioSelect.options].some((option) => option.value === scenarioValue)) scenarioSelect.value = scenarioValue
      document.title = `ATape · ${scenarioSelect.selectedOptions[0]?.textContent || "Authentication"}`
      if (focus) {
        window.scrollTo(0, 0)
        requestAnimationFrame(() => document.querySelector("h1[tabindex='-1']")?.focus())
      }
    }

    function scenarioForState() {
      if (state.screen === "login" && state.returnTo === "cli") return "cli-signed-out"
      if (state.screen === "cli" && state.cliStatus === "expired") return "cli-expired"
      if (state.screen === "cli") return "cli-review"
      if (state.screen === "account" && state.serviceError) return "account-error"
      return state.screen
    }

    function resetScenario(scenario) {
      state.flash = ""
      state.returnTo = null
      state.serviceError = false
      if (scenario === "login") {
        state.screen = "login"
        state.signedIn = false
      } else if (scenario === "onboarding" || scenario === "create-team" || scenario === "join-team" || scenario === "workspace") {
        state.screen = scenario
        state.signedIn = true
      } else if (scenario === "cli-signed-out") {
        state.screen = "login"
        state.signedIn = false
        state.returnTo = "cli"
        state.cliStatus = "pending"
      } else if (scenario === "cli-review") {
        state.screen = "cli"
        state.signedIn = true
        state.cliStatus = "pending"
      } else if (scenario === "cli-expired") {
        state.screen = "cli"
        state.signedIn = true
        state.cliStatus = "expired"
      } else if (scenario === "account" || scenario === "account-error") {
        state.screen = "account"
        state.signedIn = true
        state.settingsTab = "account"
        state.serviceError = scenario === "account-error"
      } else if (scenario === "team") {
        state.screen = "team"
        state.signedIn = true
        state.settingsTab = "team"
      }
      render({ focus: true })
    }

    function resetPrototypeData(scenario) {
      state.teamName = "Personal Lab"
      state.teamSlug = "personal-lab"
      state.sessions = initialSessions()
      state.credentials = initialCredentials()
      state.joinEnabled = true
      state.joinCode = "7K2M9A"
      state.joinCodeFresh = false
      state.members = [
        { id: "me", handle: "@singlemai", name: "Mai Li", role: "Owner", current: true },
        { id: "alex", handle: "@alex", name: "Alex Chen", role: "Member", current: false }
      ]
      resetScenario(scenario)
      showToast("Prototype state reset")
    }

    function showToast(message) {
      toast.textContent = message
      toast.classList.add("visible")
      window.clearTimeout(toastTimer)
      toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 3200)
    }

    function openConfirmation({ eyebrow = "Confirm action", title, description, confirmText = "Confirm", danger = true, onConfirm }) {
      dialogEyebrow.textContent = eyebrow
      dialogTitle.textContent = title
      dialogDescription.textContent = description
      dialogConfirm.textContent = confirmText
      dialogConfirm.className = `button ${danger ? "button-danger" : "button-primary"}`
      pendingConfirmation = onConfirm
      dialog.showModal()
    }

    function closeDialog() {
      pendingConfirmation = null
      dialog.close()
    }

    function slugify(value) {
      return value.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48)
    }

    function copyText(value) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(value).then(() => showToast("Join code copied")).catch(() => fallbackCopy(value))
      } else {
        fallbackCopy(value)
      }
    }

    function fallbackCopy(value) {
      const input = document.createElement("textarea")
      input.value = value
      input.setAttribute("readonly", "")
      input.style.position = "fixed"
      input.style.opacity = "0"
      document.body.append(input)
      input.select()
      document.execCommand("copy")
      input.remove()
      showToast("Join code copied")
    }

    scenarioSelect.addEventListener("change", (event) => resetScenario(event.target.value))

    dialog.addEventListener("cancel", (event) => {
      event.preventDefault()
      closeDialog()
    })

    dialogConfirm.addEventListener("click", () => {
      const action = pendingConfirmation
      closeDialog()
      action?.()
    })

    document.addEventListener("input", (event) => {
      if (event.target.id === "team-name") {
        const slugInput = document.querySelector("#team-slug")
        if (slugInput && !slugInput.dataset.edited) {
          slugInput.value = slugify(event.target.value)
          document.querySelector("#team-url-preview strong").textContent = slugInput.value || "your-team"
        }
      }
      if (event.target.id === "team-slug") {
        event.target.dataset.edited = "true"
        event.target.value = slugify(event.target.value)
        document.querySelector("#team-url-preview strong").textContent = event.target.value || "your-team"
      }
      if (event.target.id === "join-code") {
        event.target.value = event.target.value.replace(/[^a-z0-9]/gi, "").toUpperCase().slice(0, 6)
        event.target.removeAttribute("aria-invalid")
        document.querySelector("#join-code-error")?.classList.add("hidden")
      }
    })

    document.addEventListener("submit", (event) => {
      if (event.target.id === "create-team-form") {
        event.preventDefault()
        const data = new FormData(event.target)
        const teamName = String(data.get("teamName") || "").trim()
        const teamSlug = String(data.get("teamSlug") || "").trim()
        if (!teamName || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(teamSlug)) {
          event.target.reportValidity()
          return
        }
        state.teamName = teamName
        state.teamSlug = teamSlug
        state.flash = `${teamName} is ready. You are its first Owner.`
        state.screen = "workspace"
        render({ focus: true })
      }

      if (event.target.id === "join-team-form") {
        event.preventDefault()
        const input = event.target.elements.joinCode
        const code = input.value.replace(/[^a-z0-9]/gi, "").toUpperCase()
        if (code !== "AT9K2M") {
          input.setAttribute("aria-invalid", "true")
          document.querySelector("#join-code-error").classList.remove("hidden")
          input.focus()
          return
        }
        state.teamName = "ATape Makers"
        state.teamSlug = "atape-makers"
        state.flash = "Joined ATape Makers as a Member."
        state.screen = "workspace"
        render({ focus: true })
      }
    })

    document.addEventListener("click", (event) => {
      const control = event.target.closest("[data-action]")
      if (!control) return
      const action = control.dataset.action
      const id = control.dataset.id

      if (action === "close-dialog") closeDialog()
      if (action === "reset-prototype") resetPrototypeData(scenarioSelect.value)
      if (action === "brand-home") {
        event.preventDefault()
        if (!state.signedIn) resetScenario("login")
        else if (["onboarding", "create-team", "join-team"].includes(state.screen)) resetScenario("onboarding")
        else resetScenario("workspace")
      }
      if (action === "github-login") {
        state.signedIn = true
        state.flash = ""
        if (state.returnTo === "cli") {
          state.returnTo = null
          state.screen = "cli"
          state.cliStatus = "pending"
        } else {
          state.screen = "onboarding"
        }
        render({ focus: true })
      }
      if (action === "open-create-team") resetScenario("create-team")
      if (action === "open-join-team") resetScenario("join-team")
      if (action === "back-onboarding") resetScenario("onboarding")
      if (action === "approve-cli") { state.cliStatus = "approved"; render({ focus: true }) }
      if (action === "deny-cli") { state.cliStatus = "denied"; render({ focus: true }) }
      if (action === "restart-cli") { state.cliStatus = "pending"; render({ focus: true }) }
      if (action === "open-workspace") resetScenario("workspace")
      if (action === "open-account") resetScenario("account")
      if (action === "open-team") resetScenario("team")
      if (action === "retry-account") { state.serviceError = false; render(); showToast("Sessions loaded") }

      if (action === "revoke-session") {
        const session = state.sessions.find((item) => item.id === id)
        if (!session) return
        openConfirmation({
          title: session.current ? "Sign out this browser?" : `Revoke ${session.title}?`,
          description: session.current ? "You will return to the sign-in page. Other browser sessions and CLI credentials stay active." : "That browser will need to sign in again. Other sessions and CLI credentials stay active.",
          confirmText: session.current ? "Sign out" : "Revoke session",
          onConfirm: () => {
            state.sessions = state.sessions.filter((item) => item.id !== id)
            if (session.current) {
              state.signedIn = false
              state.screen = "login"
              state.flash = "This browser session was signed out."
              render({ focus: true })
            } else {
              render()
              showToast(`${session.title} revoked`)
            }
          }
        })
      }

      if (action === "revoke-all-sessions") {
        openConfirmation({
          title: "Revoke every browser session?",
          description: "Every browser, including this one, will be signed out. CLI credentials stay active.",
          confirmText: "Revoke all sessions",
          onConfirm: () => {
            state.sessions = []
            state.signedIn = false
            state.screen = "login"
            state.flash = "All browser sessions were revoked. Sign in again when you are ready."
            render({ focus: true })
          }
        })
      }

      if (action === "revoke-credential") {
        const credential = state.credentials.find((item) => item.id === id)
        if (!credential) return
        openConfirmation({
          title: "Revoke this CLI credential?",
          description: "That CLI login will stop working immediately. Browser sessions are unaffected.",
          confirmText: "Revoke credential",
          onConfirm: () => {
            state.credentials = state.credentials.filter((item) => item.id !== id)
            render()
            showToast("CLI credential revoked")
          }
        })
      }

      if (action === "revoke-all-credentials") {
        openConfirmation({
          title: "Revoke every CLI credential?",
          description: "All currently connected CLIs will stop working and must sign in again. Browser sessions are unaffected.",
          confirmText: "Revoke all credentials",
          onConfirm: () => {
            state.credentials = []
            render()
            showToast("All CLI credentials revoked")
          }
        })
      }

      if (action === "copy-join-code") copyText(state.joinCode)
      if (action === "rotate-join-code") {
        openConfirmation({
          eyebrow: "Fresh confirmation",
          title: "Rotate the Team join code?",
          description: "The current code will stop working immediately. Confirm your GitHub identity to create a replacement.",
          confirmText: "Continue with GitHub",
          danger: false,
          onConfirm: () => {
            state.joinCode = state.joinCode === "7K2M9A" ? "F4R8NX" : "7K2M9A"
            state.joinCodeFresh = true
            render()
            showToast("New join code created")
          }
        })
      }
      if (action === "disable-join-code") {
        openConfirmation({
          title: "Disable joining by code?",
          description: "The current code will stop working immediately. Existing Team members keep their access.",
          confirmText: "Disable code",
          onConfirm: () => {
            state.joinEnabled = false
            state.joinCode = ""
            state.joinCodeFresh = false
            render()
            showToast("Joining by code disabled")
          }
        })
      }
      if (action === "enable-join-code") {
        openConfirmation({
          eyebrow: "Fresh confirmation",
          title: "Enable joining by code?",
          description: "Anyone with the new code can join this Team as a Member. Confirm your GitHub identity to continue.",
          confirmText: "Continue with GitHub",
          danger: false,
          onConfirm: () => {
            state.joinEnabled = true
            state.joinCode = "C7T4PN"
            state.joinCodeFresh = true
            render()
            showToast("New join code created")
          }
        })
      }

      if (action === "toggle-member-role") {
        const member = state.members.find((item) => item.id === id)
        if (!member) return
        const promoting = member.role !== "Owner"
        openConfirmation({
          eyebrow: "Fresh confirmation",
          title: promoting ? `Make ${member.name} an Owner?` : `Make ${member.name} a Member?`,
          description: promoting ? "Owners can manage members, roles, join codes, and Team security. Confirm your GitHub identity to continue." : "They will immediately lose Team administration access. At least one Owner must remain.",
          confirmText: "Continue with GitHub",
          danger: false,
          onConfirm: () => {
            member.role = promoting ? "Owner" : "Member"
            render()
            showToast(`${member.name} is now ${member.role === "Owner" ? "an Owner" : "a Member"}`)
          }
        })
      }

      if (action === "remove-member") {
        const member = state.members.find((item) => item.id === id)
        if (!member) return
        openConfirmation({
          eyebrow: member.role === "Owner" ? "Fresh confirmation" : "Confirm action",
          title: `Remove ${member.name} from this Team?`,
          description: member.role === "Owner" ? "They will immediately lose Team administration and Project access. Confirm your GitHub identity to continue." : "They will immediately lose access to this Team and its Projects. Their account and access to other Teams are unaffected.",
          confirmText: member.role === "Owner" ? "Continue with GitHub" : "Remove member",
          danger: member.role !== "Owner",
          onConfirm: () => {
            state.members = state.members.filter((item) => item.id !== id)
            render()
            showToast(`${member.name} removed`)
          }
        })
      }

      if (action === "leave-team") {
        openConfirmation({
          title: `Leave ${state.teamName}?`,
          description: "You will immediately lose access to this Team and its Projects. Your account and other Teams are unaffected.",
          confirmText: "Leave Team",
          onConfirm: () => {
            state.screen = "onboarding"
            render({ focus: true })
            showToast(`You left ${state.teamName}`)
          }
        })
      }
    })

    render()
  </script>
</body>
</html>
