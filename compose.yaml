name: atape

x-atape-server-image: &atape-server-image
  image: ${ATAPE_SERVER_IMAGE:-atape-server:0.2.0}

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atape
      POSTGRES_USER: atape
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atape -d atape"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Compose file secrets retain their host UID on Linux. This one-shot,
  # networkless process prepares only the Server-readable copies and Raw root;
  # the long-running Server remains unprivileged and mounts them read-only.
  server-init:
    <<: *atape-server-image
    pull_policy: never
    restart: "no"
    init: true
    user: "0:0"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        umask 077
        chmod 0700 /run/atape-secrets
        chown atape:atape /run/atape-secrets /var/lib/atape/raw
        for secret in database_url auth_pepper_key_ring auth_private_state_key_ring github_client_secret; do
          test -f "/run/secrets/$$secret"
          cp "/run/secrets/$$secret" "/run/atape-secrets/.$$secret.tmp"
          chmod 0400 "/run/atape-secrets/.$$secret.tmp"
          chown atape:atape "/run/atape-secrets/.$$secret.tmp"
          mv -f "/run/atape-secrets/.$$secret.tmp" "/run/atape-secrets/$$secret"
        done
    secrets:
      - database_url
      - auth_pepper_key_ring
      - auth_private_state_key_ring
      - github_client_secret
    volumes:
      - server-secrets:/run/atape-secrets
      - raw-data:/var/lib/atape/raw

  server:
    <<: *atape-server-image
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
      args:
        ATAPE_RELEASE_VERSION: 0.2.0
        ATAPE_RELEASE_EPOCH: auth-v1
        ATAPE_MINIMUM_CLI_VERSION: 0.2.0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ATAPE_SERVER_ADDRESS: 0.0.0.0:8080
      ATAPE_DATABASE_URL_FILE: /run/secrets/database_url
      ATAPE_RAW_DIRECTORY: /var/lib/atape/raw
      ATAPE_DEMO_MODE: "false"
      ATAPE_PUBLIC_URL: ${ATAPE_PUBLIC_URL:?set ATAPE_PUBLIC_URL in .env}
      ATAPE_API_PUBLIC_URL: ${ATAPE_API_PUBLIC_URL:-}
      ATAPE_COOKIE_DOMAIN: ${ATAPE_COOKIE_DOMAIN:-}
      ATAPE_DEVELOPMENT_ALLOW_HTTP: ${ATAPE_DEVELOPMENT_ALLOW_HTTP:-false}
      ATAPE_AUTH_CUTOVER_MODE: ${ATAPE_AUTH_CUTOVER_MODE:-normal}
      ATAPE_AUTH_PEPPER_KEY_RING_FILE: /run/secrets/auth_pepper_key_ring
      ATAPE_AUTH_PRIVATE_STATE_KEY_RING_FILE: /run/secrets/auth_private_state_key_ring
      ATAPE_GITHUB_CLIENT_ID: ${ATAPE_GITHUB_CLIENT_ID:?set ATAPE_GITHUB_CLIENT_ID in .env}
      ATAPE_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
    volumes:
      - server-secrets:/run/secrets:ro
      - raw-data:/var/lib/atape/raw
    depends_on:
      database:
        condition: service_healthy
      server-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        ATAPE_RELEASE_VERSION: 0.2.0
        ATAPE_RELEASE_EPOCH: auth-v1
        ATAPE_MINIMUM_CLI_VERSION: 0.2.0
        VITE_ATAPE_API_ORIGIN: ${ATAPE_API_PUBLIC_URL:-}
    restart: unless-stopped
    ports:
      - "${ATAPE_BIND_ADDRESS:-127.0.0.1}:${ATAPE_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  raw-data:
  server-secrets:

secrets:
  postgres_password:
    file: ${ATAPE_POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password}
  database_url:
    file: ${ATAPE_DATABASE_URL_SECRET_FILE:-./secrets/database_url}
  auth_pepper_key_ring:
    file: ${ATAPE_AUTH_PEPPER_KEY_RING_SECRET_FILE:-./secrets/auth_pepper_key_ring.json}
  auth_private_state_key_ring:
    file: ${ATAPE_AUTH_PRIVATE_STATE_KEY_RING_SECRET_FILE:-./secrets/auth_private_state_key_ring.json}
  github_client_secret:
    file: ${ATAPE_GITHUB_CLIENT_SECRET_FILE:-./secrets/github_client_secret}
