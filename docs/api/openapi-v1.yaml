openapi: 3.1.0
info:
  title: ATape HTTP API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    First-party ATape Web and CLI contract. Domain behavior is owned by the
    Authentication, Team, ingestion, conversation, Raw, and Search Modules;
    this document describes only their HTTP representation.
servers:
  - url: https://atape.net
    description: Official service API origin
tags:
  - {name: Protocol, description: Public liveness and instance-discovery documents.}
  - {name: Authentication, description: Federated login and Web Session lifecycle.}
  - {name: Account, description: Current User and credential self-service.}
  - {name: CLI authorization, description: First-party browser-assisted CLI authorization.}
  - {name: Teams, description: Team and Membership control plane.}
  - {name: Projects, description: Project matching and lifecycle.}
  - {name: Captured sessions, description: "Authorized Canonical, Search, and Raw reads."}
  - {name: Ingestion, description: Authenticated Canonical and Raw ingestion.}
x-atape-route-classes:
  public_protocol: Never establishes an optional Principal.
  any_principal: Accepts exactly one valid Web Session or CLI Credential.
  web_only: Accepts a Web Session; unsafe methods also require exact Origin and CSRF proof.
  cli_only: Accepts a CLI Credential in the Authorization header.
x-atape-auth-cutover-bootstrap-routes:
  - GET /healthz
  - GET /readyz
  - GET /api/v1/instance
  - GET /api/v1/auth/provider-registrations
  - POST /api/v1/auth/federated/sign-ins
  - POST /api/v1/auth/federated/identity-bindings
  - POST /api/v1/auth/federated/reauthentications
  - GET /api/v1/auth/github/callback
  - GET /api/v1/auth/session
  - POST /api/v1/auth/logout
  - GET /api/v1/users/me
  - PATCH /api/v1/users/me
  - GET /api/v1/users/me/external-identities
  - GET /api/v1/users/me/web-sessions
  - DELETE /api/v1/users/me/web-sessions/{sessionId}
  - POST /api/v1/users/me/web-sessions/revoke-all
x-atape-authorization-actions:
  - workspace.list_visible
  - team.create
  - user.read_self
  - user.update_profile
  - external_identity.list
  - external_identity.bind
  - web_session.list
  - web_session.revoke_one
  - web_session.revoke_all
  - cli_credential.list
  - cli_credential.revoke_one
  - cli_credential.revoke_all
  - cli_credential.read_current
  - cli_credential.revoke_current
  - team.join_with_code
  - team.read_metadata
  - project.list_metadata
  - project.read_metadata
  - project.match
  - membership.list
  - team.update_display_profile
  - membership.promote_to_owner
  - membership.demote_owner
  - membership.remove_member
  - membership.remove_owner
  - membership.leave_self
  - team_join_code.read_status
  - team_join_code.rotate
  - team_join_code.disable
  - project.create
  - folder_project.rename
  - git_project.relink_repository
  - project.archive
  - project.delete
  - project_memory.read
  - conversation.read
  - project_search.query
  - raw_session.list
  - raw_object.read
  - canonical.ingest
  - raw.ingest
  - captured_session.delete_own
  - captured_session.delete_any
paths:
  /healthz:
    get:
      operationId: getHealth
      x-atape-authorization-actions: []
      tags: [Protocol]
      summary: Report process liveness
      x-atape-route: {class: public_protocol, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      responses:
        "200": {$ref: "#/components/responses/Health"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /readyz:
    get:
      operationId: getReadiness
      x-atape-authorization-actions: []
      tags: [Protocol]
      summary: Report readiness for the configured normal or bootstrap serving mode
      x-atape-route: {class: public_protocol, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      responses:
        "200": {$ref: "#/components/responses/Readiness"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/instance:
    get:
      operationId: getInstance
      x-atape-authorization-actions: []
      tags: [Protocol]
      summary: Discover canonical public origins and protocol versions
      x-atape-route: {class: public_protocol, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: public-300, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      responses:
        "200": {$ref: "#/components/responses/Instance"}
        "304": {$ref: "#/components/responses/NotModified"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/provider-registrations:
    get:
      operationId: listProviderRegistrations
      x-atape-authorization-actions: []
      tags: [Authentication]
      summary: List enabled sign-in entries
      x-atape-route: {class: public_protocol, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: public-300, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      responses:
        "200": {$ref: "#/components/responses/ProviderRegistrations"}
        "304": {$ref: "#/components/responses/NotModified"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/federated/sign-ins:
    post:
      operationId: beginFederatedSignIn
      x-atape-authorization-actions: []
      tags: [Authentication]
      summary: Begin a browser sign-in transaction
      x-atape-route: {class: public_protocol, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      parameters:
        - {$ref: "#/components/parameters/Origin"}
      requestBody: {$ref: "#/components/requestBodies/FederatedBegin"}
      responses:
        "201": {$ref: "#/components/responses/FederatedChallenge"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/federated/identity-bindings:
    post:
      operationId: beginFederatedIdentityBinding
      x-atape-authorization-actions: [external_identity.bind]
      tags: [Authentication]
      summary: Begin binding another external identity
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: true, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/FederatedBegin"}
      responses:
        "201": {$ref: "#/components/responses/FederatedChallenge"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/federated/reauthentications:
    post:
      operationId: beginFederatedReauthentication
      x-atape-authorization-actions: []
      tags: [Authentication]
      summary: Begin refreshing the current Web Session
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/FederatedBegin"}
      responses:
        "201": {$ref: "#/components/responses/FederatedChallenge"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/github/callback:
    get:
      operationId: completeGitHubFederatedLogin
      x-atape-authorization-actions: []
      tags: [Authentication]
      summary: Complete the exact GitHub callback transaction
      description: The only API operation that redirects. Provider error descriptions are never forwarded.
      x-atape-route: {class: public_protocol, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: code, in: query, required: false, schema: {type: string, maxLength: 4096}}
        - {name: error, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: iss, in: query, required: true, schema: {type: string, format: uri, maxLength: 2048}}
      responses:
        "303": {$ref: "#/components/responses/FederatedRedirect"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/session:
    get:
      operationId: getCurrentWebSession
      x-atape-authorization-actions: [user.read_self]
      tags: [Authentication]
      summary: Bootstrap the current User, Session, and CSRF proof
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      responses:
        "200": {$ref: "#/components/responses/SessionBootstrap"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      operationId: logoutWebSession
      x-atape-authorization-actions: [web_session.revoke_one]
      tags: [Authentication]
      summary: Revoke and clear the current Web Session
      description: Missing or already-revoked session state remains an idempotent success.
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      x-atape-authorization-actions: [user.read_self]
      tags: [Account]
      summary: Read the current User profile
      x-atape-route: {class: any_principal, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}, {cliCredential: []}]
      responses:
        "200": {$ref: "#/components/responses/User"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateCurrentUser
      x-atape-authorization-actions: [user.update_profile]
      tags: [Account]
      summary: Update the local User profile
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/UserProfile"}
      responses:
        "200": {$ref: "#/components/responses/User"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/external-identities:
    get:
      operationId: listExternalIdentities
      x-atape-authorization-actions: [external_identity.list]
      tags: [Account]
      summary: List normalized external identities without provider secrets
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      responses:
        "200": {$ref: "#/components/responses/ExternalIdentities"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/web-sessions:
    get:
      operationId: listWebSessions
      x-atape-authorization-actions: [web_session.list]
      tags: [Account]
      summary: List active non-secret Web Session records
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      responses:
        "200": {$ref: "#/components/responses/WebSessions"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/web-sessions/{sessionId}:
    parameters:
      - {$ref: "#/components/parameters/SessionId"}
    delete:
      operationId: revokeWebSession
      x-atape-authorization-actions: [web_session.revoke_one]
      tags: [Account]
      summary: Revoke one Web Session
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/web-sessions/revoke-all:
    post:
      operationId: revokeAllWebSessions
      x-atape-authorization-actions: [web_session.revoke_all]
      tags: [Account]
      summary: Revoke all Web Sessions for the current User
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/cli-credentials:
    get:
      operationId: listCliCredentials
      x-atape-authorization-actions: [cli_credential.list]
      tags: [Account]
      summary: List active non-secret CLI Credential records
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      responses:
        "200": {$ref: "#/components/responses/CLICredentials"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/cli-credentials/{credentialId}:
    parameters:
      - {$ref: "#/components/parameters/CredentialId"}
    delete:
      operationId: revokeCliCredential
      x-atape-authorization-actions: [cli_credential.revoke_one]
      tags: [Account]
      summary: Revoke one CLI Credential
      x-atape-route: {class: web_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/users/me/cli-credentials/revoke-all:
    post:
      operationId: revokeAllCliCredentials
      x-atape-authorization-actions: [cli_credential.revoke_all]
      tags: [Account]
      summary: Revoke all CLI Credentials for the current User
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/device-grants:
    post:
      operationId: createCliDeviceGrant
      x-atape-authorization-actions: []
      tags: [CLI authorization]
      summary: Create a CLI Device Authorization
      x-atape-route: {class: public_protocol, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "201": {$ref: "#/components/responses/CLIDeviceGrant"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/token:
    post:
      operationId: pollCliDeviceGrant
      x-atape-authorization-actions: []
      tags: [CLI authorization]
      summary: Poll and claim a CLI Credential once
      x-atape-route: {class: public_protocol, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: []
      requestBody: {$ref: "#/components/requestBodies/DeviceCode"}
      responses:
        "200": {$ref: "#/components/responses/CLICredentialGrant"}
        "202": {$ref: "#/components/responses/AuthorizationPending"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/device-grants/resolve:
    post:
      operationId: resolveCliDeviceGrant
      x-atape-authorization-actions: []
      tags: [CLI authorization]
      summary: Resolve a human-entered User Code to a non-secret review view
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/UserCode"}
      responses:
        "200": {$ref: "#/components/responses/CLIDeviceGrantView"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/device-grants/{grantViewId}/approve:
    parameters:
      - {$ref: "#/components/parameters/GrantViewId"}
    post:
      operationId: approveCliDeviceGrant
      x-atape-authorization-actions: []
      tags: [CLI authorization]
      summary: Approve a CLI Device Authorization
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/device-grants/{grantViewId}/deny:
    parameters:
      - {$ref: "#/components/parameters/GrantViewId"}
    post:
      operationId: denyCliDeviceGrant
      x-atape-authorization-actions: []
      tags: [CLI authorization]
      summary: Deny a CLI Device Authorization
      x-atape-route: {class: web_only, requestBodyPolicy: json-auth, requestBodyLimit: 16384, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/EmptyJSON"}
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/auth/cli/credentials/current:
    delete:
      operationId: revokeCurrentCliCredential
      x-atape-authorization-actions: [cli_credential.read_current, cli_credential.revoke_current]
      tags: [CLI authorization]
      summary: Revoke the presented CLI Credential
      description: Unknown, malformed, and already-revoked bearer values are indistinguishable successful no-ops.
      x-atape-route: {class: cli_only, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{cliCredential: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      x-atape-authorization-actions: [workspace.list_visible, team.read_metadata, project.list_metadata]
      tags: [Teams]
      summary: List Team and Project metadata visible to the current User
      x-atape-route: {class: any_principal, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}, {cliCredential: []}]
      responses:
        "200": {$ref: "#/components/responses/Workspace"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/teams:
    post:
      operationId: createTeam
      x-atape-authorization-actions: [team.create]
      tags: [Teams]
      summary: Create a Team with the current User as Owner
      x-atape-route: {class: web_only, requestBodyPolicy: json-control-plane, requestBodyLimit: 65536, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: true}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/TeamCreate"}
      responses:
        "201": {$ref: "#/components/responses/Team"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/teams/{teamSlug}:
    parameters:
      - {$ref: "#/components/parameters/TeamSlug"}
    get:
      operationId: getTeam
      x-atape-authorization-actions: [team.read_metadata]
      tags: [Teams]
      summary: Read visible Team metadata
      x-atape-route: {class: any_principal, requestBodyPolicy: none, requestBodyLimit: 0, cachePolicy: no-store, originPolicy: none, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}, {cliCredential: []}]
      responses:
        "200": {$ref: "#/components/responses/Team"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateTeam
      x-atape-authorization-actions: [team.update_display_profile]
      tags: [Teams]
      summary: Update a Team display profile as Owner
      x-atape-route: {class: web_only, requestBodyPolicy: json-control-plane, requestBodyLimit: 65536, cachePolicy: no-store, originPolicy: exact-web, freshAuthentication: false, requiresIdempotencyKey: false}
      security: [{webSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/CSRF"}
      requestBody: {$ref: "#/components/requestBodies/TeamUpdate"}
      responses:
        "200": {$ref: "#/components/responses/Team"}
        "4XX": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/teams/{teamSlug}/members:
    parameters:
      - {$ref: "#/components/parameters/TeamSlug"}
    get:
      operationId: listTeamMembers
      x-atape-authorization-actions: [membership.list]
      tags: [Teams]
      summary: List active Team Memberships
